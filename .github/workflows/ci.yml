name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The four commands CLAUDE.md calls the verification gate. CI used to run only
  # two of them, so a lint or build break could land on main under a green tick.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json. Pinning it in both places makes action-setup refuse to run
      # ("Multiple versions of pnpm specified"), which is why every CI run on
      # this branch died at setup before a single check executed.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The browser suites. They existed but nothing ran them — not CI, not the local
  # gate (rightly excluded there: they need system libraries a cloud VM may lack
  # and would hang a headless session). A separate job is where they belong: the
  # keyboard, virtualization, thumbnail and a11y regressions they cover are
  # invisible to the unit suite.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json. Pinning it in both places makes action-setup refuse to run
      # ("Multiple versions of pnpm specified"), which is why every CI run on
      # this branch died at setup before a single check executed.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @ce/web build
      - run: pnpm test:browser
      - run: pnpm --filter @ce/web test:browser:gallery
      - run: pnpm --filter @ce/host test:browser:thumbnail
      - run: pnpm --filter @ce/host test:browser:a11y
